name: CI

# Runs on every pull request and every push to main. Workers Builds still does the deploy;
# this catches type errors, lint problems and broken behaviour before (or as) it ships.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Next.js build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
